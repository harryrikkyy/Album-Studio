<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album Studio — shell spike</title>
<style>
  :root { --bg:#14171c; --panel:#1c2027; --line:#2a3039; --text:#eceae4; --muted:#9aa3ae; --accent:#e9a06a; --ok:#7fb2f0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif; }
  header { height:52px; display:flex; align-items:center; gap:12px; padding:0 20px 0 84px; border-bottom:1px solid var(--line); -webkit-app-region: drag; }
  header b { font-weight:650; letter-spacing:.2px; }
  main { padding:28px; display:grid; grid-template-columns: 380px 1fr; gap:28px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; }
  h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); font-weight:600; }
  button { background:var(--accent); color:#1a1208; border:0; border-radius:8px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .row { display:flex; gap:10px; align-items:center; margin:10px 0; flex-wrap:wrap; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:13px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; }
  .grid img { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:6px; background:#0d0f12; }
  .ok { color:var(--ok); } .bad { color:#ff9b8a; }
  ul { margin:0; padding-left:18px; } li { margin:4px 0; }
</style>
</head>
<body>
<header><b>Album Studio</b><span class="mono">native shell spike</span></header>
<main>
  <div style="display:flex;flex-direction:column;gap:20px">
    <section>
      <h2>Bridge</h2>
      <div class="row"><button id="ping">Run 200 round trips</button></div>
      <div id="pingOut" class="mono">—</div>
      <div id="info" class="mono" style="margin-top:8px">—</div>
    </section>
    <section>
      <h2>Edit a sheet in PhotoCraft</h2>
      <ul id="sheets"></ul>
      <div id="openOut" class="mono" style="margin-top:8px"></div>
    </section>
  </div>
  <section>
    <h2>Thumbnails straight from disk</h2>
    <div id="thumbsOut" class="mono" style="margin-bottom:10px">loading…</div>
    <div id="thumbs" class="grid"></div>
  </section>
</main>
<script>
  // Request/response over the shell bridge.
  const pending = new Map(); let next = 1;
  window.__asReply = (r) => { const p = pending.get(r.id); if (!p) return; pending.delete(r.id); r.ok ? p.resolve(r.result) : p.reject(new Error(r.error)); };
  const call = (method, params = {}) => new Promise((resolve, reject) => { const id = next++; pending.set(id, { resolve, reject }); window.ipc.postMessage(JSON.stringify({ id, method, params })); });
  const fileUrl = (p) => 'as://file' + p.split('/').map(encodeURIComponent).join('/');

  call('shell.info').then(i => { document.getElementById('info').textContent = 'PhotoCraft ' + i.photocraft; });

  document.getElementById('ping').onclick = async () => {
    const out = document.getElementById('pingOut'); const t = [];
    for (let n = 0; n < 200; n++) { const t0 = performance.now(); const r = await call('shell.ping', { n }); if (r.pong !== n) throw new Error('bad pong'); t.push(performance.now() - t0); }
    t.sort((a, b) => a - b);
    out.innerHTML = `<span class="ok">200/200 ok</span> · median ${t[100].toFixed(2)} ms · p95 ${t[190].toFixed(2)} ms · max ${t[199].toFixed(2)} ms`;
  };

  const SHEETS = [
    '/Volumes/Harry/ALBUM BOOKINGS/Sai BFA/Wedding Album/exports/Page_005.psd',
    '/Volumes/Harry/ALBUM BOOKINGS/Sai BFA/Wedding Album/exports/Page_023.psd',
    '/Volumes/Harry/ALBUM BOOKINGS/Sai BFA/Engagement Album/exports/Page_001.psd',
  ];
  const list = document.getElementById('sheets');
  for (const s of SHEETS) {
    const li = document.createElement('li'); const b = document.createElement('button'); b.className = 'ghost';
    b.textContent = s.split('/').slice(-3).join(' / ');
    b.onclick = async () => { const o = document.getElementById('openOut'); try { await call('editor.open', { path: s }); o.innerHTML = '<span class="ok">opened in editor</span>'; } catch (e) { o.innerHTML = '<span class="bad">' + e.message + '</span>'; } };
    li.append(b); list.append(li);
  }

  // 24 wedding thumbnails, loaded from disk through the as:// protocol.
  const thumbsReady = (async () => {
    const dir = '/Volumes/Harry/ALBUM BOOKINGS/Sai BFA/wedding/_Thumbnails/';
    const names = ['DSC05308','DSC05311','DSC05314','DSC05326','DSC05328','DSC05353','DSC05360','DSC05362','DSC05371','DSC05382','DSC05385','DSC05391','DSC05419','DSC05429','DSC05435','DSC05446','DSC05474','DSC05484','DSC05492','DSC05508','DSC05512','DSC05521','DSC05528','DSC05545'];
    const grid = document.getElementById('thumbs'); const t0 = performance.now(); let loaded = 0, failed = 0;
    await Promise.all(names.map(n => new Promise(res => { const img = new Image(); img.onload = () => { loaded++; res(); }; img.onerror = () => { failed++; res(); }; img.src = fileUrl(dir + n + '.jpg'); grid.append(img); })));
    const ms = Math.round(performance.now() - t0);
    document.getElementById('thumbsOut').innerHTML = `<span class="${failed ? 'bad' : 'ok'}">${loaded} loaded, ${failed} failed</span> in ${ms} ms`;
    return { loaded, failed, ms };
  })();

  // ?selftest: run every check, report each result to the shell's log, then exercise the
  // album → editor → album switch with a real sheet.
  if (location.search.includes('selftest')) (async () => {
    const log = (step, data) => call('shell.log', { step, ...data });
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    try {
      await log('page-loaded', { userAgent: navigator.userAgent });
      const info = await call('shell.info'); await log('info', info);
      const t = [];
      for (let n = 0; n < 200; n++) { const t0 = performance.now(); const r = await call('shell.ping', { n }); if (r.pong !== n) throw new Error('bad pong ' + n); t.push(performance.now() - t0); }
      t.sort((a, b) => a - b);
      await log('bridge', { roundTrips: 200, medianMs: +t[100].toFixed(3), p95Ms: +t[190].toFixed(3), maxMs: +t[199].toFixed(3) });
      await log('thumbnails', await thumbsReady);
      try { await call('no.such.method'); await log('unknown-method', { ok: false, note: 'expected an error' }); }
      catch (e) { await log('unknown-method', { ok: true, error: e.message }); }
      try { await call('editor.open', { path: '/nope/missing.psd' }); await log('missing-file', { ok: false }); }
      catch (e) { await log('missing-file', { ok: true, error: e.message }); }
      const t1 = performance.now();
      await call('editor.open', { path: SHEETS[0] });
      await log('editor-open-requested', { path: SHEETS[0], ms: Math.round(performance.now() - t1) });
      let doc = null;
      for (let i = 0; i < 120; i++) { await wait(250); try { doc = await call('editor.inspect'); if (doc && doc.width) break; } catch (_) {} }
      await log('editor-document', doc ? { name: doc.name, width: doc.width, height: doc.height, layers: (doc.layers || []).length, afterMs: Math.round(performance.now() - t1) } : { error: 'no document after 30 s' });
      await log('mode-in-editor', await call('shell.info'));
      // The page is hidden in the editor and its timers pause, so the shell brings it back.
      await call('shell.selftestReturnAfter', { ms: 5000 });
      for (let i = 0; i < 400; i++) { await wait(100); const m = await call('shell.info'); if (m.mode === 'Album') break; }
      await log('mode-after-back', await call('shell.info'));
      await log('done', { ok: true });
    } catch (e) { await log('failed', { error: String(e && e.message || e) }); }
  })();
</script>
</body>
</html>
