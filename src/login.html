<!DOCTYPE html>
<html lang="en" data-theme="studio-dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Hubb — Sign in</title>
<!-- The front door wears the same studio-dark identity as the app:
     tokens come from style.css; this block is layout + login-only pieces. -->
<link rel="stylesheet" href="style.css">
<style>
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }

  .login-card {
    position: relative;
    width: 420px;
    padding: 48px 44px;
    background: var(--bg-panel);
    border: 1px solid var(--border-main);
    border-radius: 10px;
    -webkit-app-region: no-drag;
  }

  .logo-wrap { margin-bottom: 28px; }

  .logo {
    font-size: 22px;
    font-weight: 600;
    color: var(--txt-primary);
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .logo-sub {
    font-size: var(--fs-md);
    color: var(--txt-secondary);
    margin-top: 2px;
  }

  .login-divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 28px 0;
  }

  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px;
    background: var(--accent-fill);
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    font: inherit;
    font-size: var(--fs-md);
    font-weight: 600;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-google:hover {
    background: var(--accent-fill-hover);
    box-shadow: 0 4px 18px var(--accent-glow);
  }
  .btn-google:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

  .status {
    margin-top: 18px;
    text-align: center;
    font-size: var(--fs-sm);
    color: var(--txt-secondary);
    min-height: 20px;
  }
  .status.error { color: var(--status-danger); }
  .status.checking { color: var(--status-warn); }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border-main);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-footer {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .login-footer-text { font-size: var(--fs-2xs); color: var(--txt-muted); }
  .login-version {
    font-size: var(--fs-2xs);
    color: var(--txt-muted);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* Subscription expired / not-activated view */
  #expiredScreen { display: none; text-align: center; }

  .expired-icon {
    font-size: 40px;
    color: var(--txt-muted);
    margin-bottom: 14px;
  }
  .expired-icon .icn { width: 1em; height: 1em; vertical-align: baseline; }

  .expired-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--txt-primary);
    margin-bottom: 8px;
  }

  .expired-msg {
    font-size: var(--fs-md);
    color: var(--txt-secondary);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .days-badge {
    display: inline-block;
    background: color-mix(in srgb, var(--status-warn) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--status-warn) 32%, transparent);
    color: var(--status-warn);
    padding: 5px 14px;
    border-radius: 999px;
    font-size: var(--fs-sm);
    font-weight: 600;
    margin-bottom: 20px;
  }

  .btn-contact {
    width: 100%;
    padding: 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border-main);
    border-radius: var(--radius-md);
    color: var(--txt-primary);
    font: inherit;
    font-size: var(--fs-md);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    margin-bottom: 10px;
  }
  .btn-contact:hover { background: var(--bg-elevated); border-color: var(--accent); }
  .btn-contact:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-switch {
    background: none;
    border: none;
    color: var(--txt-muted);
    font: inherit;
    font-size: var(--fs-xs);
    cursor: pointer;
    margin-top: 6px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .btn-switch:hover { color: var(--txt-primary); }

  /* Quit button for the frameless login window (R7) — always lets the user
     close the app even when sign-in is impossible (no internet on first run). */
  #btnQuit {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid var(--border-subtle);
    color: var(--txt-muted);
    border-radius: var(--radius-md);
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: color 0.15s ease, border-color 0.15s ease;
    z-index: 2;
  }
  #btnQuit:hover { border-color: var(--status-danger); color: var(--status-danger); }

  .btn-google:focus-visible, .btn-contact:focus-visible,
  .btn-switch:focus-visible, #btnQuit:focus-visible {
    outline: 2px solid var(--select-ring);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-google, .btn-contact, #btnQuit { transition: none; }
  }
</style>
</head>
<body>

<div class="login-card">
  <button id="btnQuit" title="Quit" aria-label="Quit application"><i data-icn="x"></i></button>
  <!-- LOGIN VIEW -->
  <div id="loginView">
    <div class="logo-wrap">
      <div class="logo">Creative Hubb</div>
      <div class="logo-sub">Album Toolkit Pro</div>
    </div>

    <div class="login-divider"></div>

    <button class="btn-google" id="btnGoogle">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFF" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/>
      </svg>
      Sign in with Google
    </button>

    <div class="status" id="statusMsg"></div>

    <div class="login-footer">
      <div class="login-footer-text">© 2025 Creative Hubb</div>
      <div class="login-version">v1.0</div>
    </div>
  </div>

  <!-- EXPIRED / NOT ACTIVATED VIEW -->
  <div id="expiredScreen">
    <div class="expired-icon"><i data-icn="lock"></i></div>
    <div class="expired-title">Access restricted</div>
    <div class="expired-msg" id="expiredMsg">
      Your subscription has expired or has not been activated yet.
      Please contact Creative Hubb to renew your access.
    </div>
    <div class="days-badge" id="daysBadge"></div>
    <button class="btn-contact" id="btnRetry">I've been activated — retry</button>
    <button class="btn-contact" id="btnContact">Contact Creative Hubb to activate</button>
    <br>
    <button class="btn-switch" id="btnSwitch">Sign in with a different account</button>
  </div>
</div>

<script src="ui_icons.js"></script>
<script src="login_renderer.js"></script>
</body>
</html>
