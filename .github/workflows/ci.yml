name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · test
    # macOS on Apple silicon, as the app ships: sharp's darwin-arm64 build, `sips` and `ioreg`.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/ui/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix native/ui

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fail the build on known high/critical vulns in production deps.
      # Dev-only tooling vulns don't ship, so they warn via Dependabot instead.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Shared modules, the helper and the interface. The PhotoCraft engine (native/photocraft,
      # a separate checkout) isn't here, so the tests that build real sheets say they skip.
      - name: Test
        run: npm test
