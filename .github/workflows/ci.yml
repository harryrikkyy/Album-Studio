name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · real-engine integration
    # macOS on Apple silicon, as the app ships: sharp's darwin-arm64 build, `sips` and `ioreg`.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/photocraft/target/album-studio-pinned
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/ui/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix native/ui

      - name: Lint
        run: npm run lint

      - name: Canonical contracts, dependency boundaries and packaged closure
        run: |
          mkdir -p ci-evidence
          npm run check:architecture > ci-evidence/architecture.json

      - name: Typecheck
        run: npm run typecheck

      # Fail the build on known high/critical vulns in production deps.
      # Dev-only tooling vulns don't ship, so they warn via Dependabot instead.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit interface dependencies
        run: npm audit --prefix native/ui --audit-level=high

      - uses: ./.github/actions/setup-album-engine

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/photocraft/target/album-studio-pinned
          key: album-integration-${{ runner.arch }}-${{ hashFiles('native/scripts/engine/pin.json') }}

      - name: Build pinned shell and real CLI
        run: node native/scripts/engine.mjs build

      - name: Install independent PDF colour verifier
        run: |
          brew install poppler
          pdftoppm -v

      - name: Test all Node suites; reject any skipped real-engine tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-evidence
          node native/scripts/engine.mjs test-node | tee ci-evidence/node-tests.log

      - name: Interface production build
        run: npm --prefix native/ui run build

      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-evidence
          path: ci-evidence/
          if-no-files-found: warn

  native:
    name: native workspace · Clippy · layering
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/photocraft/target/ci-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: ./.github/actions/setup-album-engine
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/photocraft/target/ci-native
          key: album-native-${{ runner.arch }}-${{ hashFiles('native/scripts/engine/pin.json') }}
      - name: Format
        working-directory: native/photocraft
        run: cargo fmt --all -- --check
      - name: Workspace tests
        working-directory: native/photocraft
        run: cargo test --workspace --locked --features heif
      - name: Explicit adversarial engine registry tests
        working-directory: native/photocraft
        run: cargo test -p photocraft-engine --test panic_hunt --locked -- --ignored
      - name: Clippy
        working-directory: native/photocraft
        run: cargo clippy --workspace --all-targets --locked --features heif -- -D warnings
      - name: Dependency layering
        working-directory: native/photocraft
        run: cargo xtask layers

  corpus:
    name: pinned real-file engine corpus
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/photocraft/target/ci-corpus
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: ./.github/actions/setup-album-engine
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/photocraft/target/ci-corpus
            native/photocraft/corpus
          key: album-corpus-${{ runner.arch }}-${{ hashFiles('native/scripts/engine/pin.json') }}
      - name: Fetch checksum-verified corpus and run actual decoder/compositor oracles
        working-directory: native/photocraft
        run: cargo xtask test-corpus
